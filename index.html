    // ============================================================
    // BUY X GET Y — Loaded from SNS public API
    //   GET /api/public/buy-x-get-y?shop=<shop>.myshopify.com
    // The merchant configures the campaign in the SNS admin; this demo
    // fetches active settings and reconciles the cart against them.
    // Demo limitations: only discountType="free" is honored, and
    // getYType="products" + buyXType in {products, collections, any}.
    // ============================================================
    var bxgyRules = [];
    var _bxgyRulesPromise; // assigned once renderBXGYBanner is defined

    async function fetchGwpSettings() {
      // TEMP: BXGY feature disabled
      return [];
      var url = snsAppUrl + '/api/public/buy-x-get-y?shop=' + encodeURIComponent(domain);
      // Accept header is required — without it the server returns 500.
      var resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
      var json = await resp.json();
      if (!json.success) throw new Error(json.message || 'GWP fetch failed');
      return json.data.settings;
    }

    function _stripPrefix(gid, prefix) {
      var m = String(gid).match(new RegExp('/' + prefix + '/(\\d+)'));
      return m ? m[1] : gid;
    }

    async function _resolveCollectionProductIds(collectionGids) {
      if (!collectionGids || !collectionGids.length) return [];
      var query = 'query($ids:[ID!]!){nodes(ids:$ids){... on Collection{id products(first:250){edges{node{id}}}}}}';
      var resp = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Shopify-Storefront-Access-Token': token },
        body: JSON.stringify({ query: query, variables: { ids: collectionGids } })
      });
      var json = await resp.json();
      var ids = [];
      ((json.data && json.data.nodes) || []).forEach(function(node) {
        if (!node || !node.products) return;
        node.products.edges.forEach(function(e) { ids.push(_stripPrefix(e.node.id, 'Product')); });
      });
      return ids;
    }

    async function _resolveProductFirstVariant(productGid) {
      var query = 'query($id:ID!){product(id:$id){id title variants(first:1){edges{node{id price{amount} compareAtPrice{amount}}}}}}';
      var resp = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Shopify-Storefront-Access-Token': token },
        body: JSON.stringify({ query: query, variables: { id: productGid } })
      });
      var json = await resp.json();
      var p = json.data && json.data.product;
      if (!p || !p.variants.edges.length) return null;
      var v = p.variants.edges[0].node;
      return {
        variantId: _stripPrefix(v.id, 'ProductVariant'),
        price: (v.compareAtPrice && v.compareAtPrice.amount) || (v.price && v.price.amount) || null
      };
    }

    async function buildBxgyRulesFromAPI() {
      var s;
      try { s = await fetchGwpSettings(); }
      catch (e) { console.warn('[BXGY] Could not load campaign:', e); return []; }

      if (!s.isActiveNow) { console.log('[BXGY] No active campaign'); return []; }
      if (s.discountType !== 'free') {
        console.warn('[BXGY] Demo only supports discountType="free"; got "' + s.discountType + '"');
        return [];
      }

      var buyProductIds = [];
      if (s.buyXType === 'products') {
        buyProductIds = (s.buyXProductIds || []).map(function(g) { return _stripPrefix(g, 'Product'); });
      } else if (s.buyXType === 'collections') {
        buyProductIds = await _resolveCollectionProductIds(s.buyXCollectionIds || []);
      } else if (s.buyXType !== 'any') {
        console.warn('[BXGY] Unsupported buyXType "' + s.buyXType + '"');
        return [];
      }

      if (s.getYType !== 'products' || !(s.getYProductIds || []).length) {
        console.warn('[BXGY] Demo only supports getYType="products" with at least one product; got "' + s.getYType + '"');
        return [];
      }
      var giftInfo = await _resolveProductFirstVariant(s.getYProductIds[0]);
      if (!giftInfo) { console.warn('[BXGY] Could not resolve gift variant for', s.getYProductIds[0]); return []; }

      var slug = (s.campaignName || 'campaign').toLowerCase().replace(/[^a-z0-9]+/g, '-') || 'campaign';
      return [{
        id: 'bxgy-' + slug,
        buyXType: s.buyXType,
        buyProductIds: buyProductIds,
        buyQuantity: s.buyXQuantity,
        giftVariantId: giftInfo.variantId,
        giftQuantity: s.getYQuantity,
        maxPerOrder: s.usageLimitPerCustomer || null,
        label: s.badgeText || 'Free Gift',
        bannerText: s.promotionMessage || ('Buy ' + s.buyXQuantity + ', get a free gift'),
        compareAtPrice: giftInfo.price ? Number(giftInfo.price) : null
      }];
    }

    // ============================================================
    // BXGY Engine — uses direct Storefront API GraphQL calls
    // ============================================================
    var _bxgyEngine = null;
    var _bxgyDebounceTimer = null;

    function BXGYEngine(cart, rules) {
      this.cart = cart;
      this.rules = rules;
      this.giftVids = new Set(rules.map(function(r){ return String(r.giftVariantId); }));
      this.busy = false;
      this._lastGiftState = {};
      _bxgyEngine = this;
      var self = this;
      setTimeout(function(){ self.reconcile(); }, 1000);
    }

    // --- Direct Storefront API helpers ---

    BXGYEngine.prototype._gql = async function(query, variables) {
      var resp = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Shopify-Storefront-Access-Token': token },
        body: JSON.stringify({ query: query, variables: variables })
      });
      return resp.json();
    };

    BXGYEngine.prototype._getCartId = function() {
      return this.cart.model && this.cart.model.id;
    };

    BXGYEngine.prototype._fetchCartLines = async function() {
      var cartId = this._getCartId();
      if (!cartId) { console.log('[BXGY] No cart ID'); return []; }

      var json = await this._gql(
        'query($id:ID!){cart(id:$id){lines(first:50){edges{node{id quantity merchandise{...on ProductVariant{id product{id}}}}}}}}',
        { id: cartId }
      );

      if (!json.data || !json.data.cart || !json.data.cart.lines) {
        console.warn('[BXGY] Could not read cart lines:', json);
        return [];
      }

      return json.data.cart.lines.edges.map(function(e) {
        var n = e.node;
        return {
          lineId: n.id,
          quantity: n.quantity,
          variantId: n.merchandise.id.replace('gid://shopify/ProductVariant/', ''),
          variantGid: n.merchandise.id,
          productId: n.merchandise.product.id.replace('gid://shopify/Product/', ''),
          productGid: n.merchandise.product.id
        };
      });
    };

    BXGYEngine.prototype._addLine = async function(variantGid, qty) {
      var cartId = this._getCartId();
      console.log('[BXGY] API → cartLinesAdd', variantGid, 'qty', qty);
      var json = await this._gql(
        'mutation($cartId:ID!,$lines:[CartLineInput!]!){cartLinesAdd(cartId:$cartId,lines:$lines){cart{id}userErrors{field message}}}',
        { cartId: cartId, lines: [{ merchandiseId: variantGid, quantity: qty, attributes: [{ key: '_bxgy_gift', value: 'true' }] }] }
      );
      if (json.errors || (json.data && json.data.cartLinesAdd && json.data.cartLinesAdd.userErrors.length)) {
        console.error('[BXGY] addLine error:', json);
      }
      return json;
    };

    BXGYEngine.prototype._updateLine = async function(lineId, qty) {
      var cartId = this._getCartId();
      console.log('[BXGY] API → cartLinesUpdate', lineId, 'qty', qty);
      var json = await this._gql(
        'mutation($cartId:ID!,$lines:[CartLineUpdateInput!]!){cartLinesUpdate(cartId:$cartId,lines:$lines){cart{id}userErrors{field message}}}',
        { cartId: cartId, lines: [{ id: lineId, quantity: qty }] }
      );
      if (json.errors) console.error('[BXGY] updateLine error:', json);
      return json;
    };

    BXGYEngine.prototype._removeLine = async function(lineId) {
      var cartId = this._getCartId();
      console.log('[BXGY] API → cartLinesRemove', lineId);
      var json = await this._gql(
        'mutation($cartId:ID!,$lineIds:[ID!]!){cartLinesRemove(cartId:$cartId,lineIds:$lineIds){cart{id}userErrors{field message}}}',
        { cartId: cartId, lineIds: [lineId] }
      );
      if (json.errors) console.error('[BXGY] removeLine error:', json);
      return json;
    };

    // Force Buy Button SDK to re-fetch cart and re-render.
    // Mirrors the SDK's native quantity-update sequence:
    //   fetchData() → assign model → updateCache(lineItems) → view.render()
    // The updateCache step is critical — the SDK renders from a cached
    // lineItems array, so without it morphdom diffs against stale state
    // and externally-added lines (like our gifts) never appear in the DOM.
    BXGYEngine.prototype._refreshSDK = async function() {
      try {
        var cart = this.cart;
        var checkout = null;

        if (typeof cart.fetchData === 'function') {
          checkout = await cart.fetchData();
          if (checkout) {
            cart.model = checkout;
            if (typeof cart.updateCache === 'function' && checkout.lineItems) {
              cart.updateCache(checkout.lineItems);
            }
          }
        } else {
          // Legacy fallback for older SDK builds
          var cartId = this._getCartId();
          var client = cart.props && cart.props.client;
          if (client && client.cart && client.cart.fetch) {
            cart.model = await client.cart.fetch(cartId);
          } else if (client && client.checkout && client.checkout.fetch) {
            cart.model = await client.checkout.fetch(cartId);
          }
        }

        if (cart.view && typeof cart.view.render === 'function') {
          await cart.view.render();
        } else if (typeof cart.render === 'function') {
          cart.render();
        }
        console.log('[BXGY] SDK cart refreshed');
      } catch (e) {
        console.warn('[BXGY] SDK refresh failed:', e);
      }
    };

    // --- Core reconciliation ---

    BXGYEngine.prototype.reconcile = async function() {
      if (this.busy) return;
      this.busy = true;

      try {
        var cartId = this._getCartId();
        if (!cartId) { console.log('[BXGY] No cart yet'); return; }

        // Fetch live cart lines from Storefront API (always fresh)
        var items = await this._fetchCartLines();
        console.log('[BXGY] Reconcile — lines:', JSON.stringify(items));

        var self = this;
        function matchesBuy(li, rule) {
          if (rule.buyXType === 'any') return true;
          return rule.buyProductIds.indexOf(li.productId) !== -1;
        }

        // Aggregate qualifying qty per rule (excluding gifts)
        var qtyByRule = {};
        this.rules.forEach(function(rule) {
          var total = 0;
          items.forEach(function(li) {
            if (self.giftVids.has(li.variantId)) return;
            if (matchesBuy(li, rule)) total += li.quantity;
          });
          qtyByRule[rule.id] = total;
        });
        console.log('[BXGY] Qualifying qty by rule:', JSON.stringify(qtyByRule));

        var cartChanged = false;

        for (var ri = 0; ri < this.rules.length; ri++) {
          var rule = this.rules[ri];

          var n = Math.floor((qtyByRule[rule.id] || 0) / rule.buyQuantity);
          if (rule.maxPerOrder) n = Math.min(n, rule.maxPerOrder);

          var want = n * rule.giftQuantity;
          var giftVid = String(rule.giftVariantId);
          var gift = items.find(function(li){ return li.variantId === giftVid; });
          var have = gift ? gift.quantity : 0;

          // Detect manual removal
          var wasPresent = this._lastGiftState[rule.id];
          if (want > 0 && !gift && wasPresent) {
            console.log('[BXGY] Gift manually removed, skipping re-add');
            this._lastGiftState[rule.id] = false;
            continue;
          }
          this._lastGiftState[rule.id] = have > 0;

          if (want === have) continue;

          console.log('[BXGY] Rule "' + rule.id + '": want=' + want + ' have=' + have);

          if (want > 0 && !gift) {
            await this._addLine('gid://shopify/ProductVariant/' + rule.giftVariantId, want);
            this._lastGiftState[rule.id] = true;
            cartChanged = true;
          } else if (want > 0 && gift) {
            await this._updateLine(gift.lineId, want);
            cartChanged = true;
          } else if (want === 0 && gift) {
            console.log('[BXGY] Removing gift — trigger no longer met');
            await this._removeLine(gift.lineId);
            this._lastGiftState[rule.id] = false;
            cartChanged = true;
          }
        }

        // Refresh SDK so UI reflects changes
        if (cartChanged) {
          await this._refreshSDK();
        }

        this._emitStatus(qtyByRule);
      } finally {
        this.busy = false;
      }
    };

    BXGYEngine.prototype._emitStatus = function(qtyByRule) {
      var detail = this.rules.map(function(r) {
        var have = qtyByRule[r.id] || 0;
        var remaining = Math.max(0, r.buyQuantity - have);
        return {
          id: r.id,
          label: r.label,
          bannerText: r.bannerText,
          qualified: remaining === 0,
          remaining: remaining,
          compareAtPrice: r.compareAtPrice
        };
      });

      renderBXGYBanner(detail);
      window.dispatchEvent(new CustomEvent('bxgy:status', { detail: detail }));
    };

    // ============================================================
    // BXGY Promo Banner Renderer
    // ============================================================
    function renderBXGYBanner(promos) {
      var container = document.getElementById('bxgy-banner');
      if (!container) return;
      container.innerHTML = '';

      promos.forEach(function(p) {
        var div = document.createElement('div');
        div.className = 'bxgy-promo ' + (p.qualified ? 'qualified' : 'not-qualified');

        var tag = document.createElement('span');
        tag.className = 'bxgy-tag';
        tag.textContent = p.label;

        var msg = document.createElement('span');
        if (p.qualified) {
          msg.textContent = p.label + ' added to your cart!';
        } else {
          msg.textContent = 'Add ' + p.remaining + ' more to get: ' + p.bannerText;
        }

        div.appendChild(tag);
        div.appendChild(msg);
        container.appendChild(div);
      });
    }

    // Kick off campaign load. Banner stays empty until settings arrive,
    // then shows the not-qualified initial state. Engine is wired up
    // inside cart.events.afterInit, gated on this same promise.
    _bxgyRulesPromise = buildBxgyRulesFromAPI().then(function(rules) {
      bxgyRules = rules;
      if (rules.length) {
        var initial = rules.map(function(r) {
          return {
            id: r.id,
            label: r.label,
            bannerText: r.bannerText,
            qualified: false,
            remaining: r.buyQuantity,
            compareAtPrice: r.compareAtPrice
          };
        });
        renderBXGYBanner(initial);
      }
      return rules;
    });

    function buyButtonOptions(opts) {
      var buttonText = (opts && opts.isPreOrder) ? 'Pre Order' : 'Buy From Us';
      return {
        product: {
          styles: {
            product: {
              '@media (min-width: 601px)': {
                'max-width': 'calc(25% - 20px)',
                'margin-left': '20px',
                'margin-bottom': '50px'
              }
            },
            button: {
              ':hover': { 'background-color': '#1d1f1d' },
              'background-color': '#111211',
              ':focus': { 'background-color': '#1d1f1d' }
            }
          },
          contents: { img: false, title: false, price: false },
          text: { button: buttonText }
        },
        productSet: { styles: { products: { '@media (min-width: 601px)': { 'margin-left': '-20px' } } } },
        modalProduct: {
          contents: { img: false, imgWithCarousel: true, button: false, buttonWithQuantity: true },
          styles: {
            product: { '@media (min-width: 601px)': { 'max-width': '100%', 'margin-left': '0px', 'margin-bottom': '0px' } },
            button: { ':hover': { 'background-color': '#1d1f1d' }, 'background-color': '#111211', ':focus': { 'background-color': '#1d1f1d' } }
          },
          text: { button: 'Add to cart' }
        },
        option: {},
        cart: {
            // 🧪 TESTING: Custom GraphQL Mode - Testing fixed fragment
            // CURRENT MODE: Custom GraphQL (with requiresShipping field)
            useCustomGraphQL: true,
            
            styles: {
                button: {
                    ':hover': { 'background-color': '#1d1f1d' },
                    'background-color': '#111211',
                    ':focus': { 'background-color': '#1d1f1d' }
                }
            },
            text: {
                total: 'Subtotal',
                notice: 'Taxes and shipping calculated at checkout.',
                button: 'Checkout'
            },
            popup: false,
            events: {
                afterRender: function(cart) {
                    // Debounce: wait 800ms so the cart model is fully updated
                    if (_bxgyDebounceTimer) clearTimeout(_bxgyDebounceTimer);
                    _bxgyDebounceTimer = setTimeout(function() {
                      if (_bxgyEngine && !_bxgyEngine.busy) {
                        _bxgyEngine.reconcile();
                      }
                    }, 800);
                },
                afterInit: function(cart) {
                    _bxgyRulesPromise.then(function(rules) {
                      if (rules.length) {
                        console.log('[BXGY] Init — cart ID:', cart.model && cart.model.id);
                        new BXGYEngine(cart, rules);
                      }
                    });

                    cart.onCheckout = function() {
                        cart._userEvent('openCheckout');
                        cart.props.tracker.track('Open cart checkout', {});
                        
                        var currentUrl = window.location.href;
                        var cartId = cart.model.id;
                        // Prefer checkoutUrl (new Cart API), fall back to webUrl (legacy Checkout API)
                        var checkoutUrl = cart.model.checkoutUrl || cart.model.webUrl;
                        
                        console.log('[Demo] Cart ID:', cartId);
                        console.log('[Demo] Checkout URL:', checkoutUrl);
                        console.log('[Demo] Cart model:', cart.model);
                        
                        if (!checkoutUrl) {
                            console.error('[Demo] No checkout URL on cart model!', cart.model);
                            return;
                        }
                        
                        // Call Storefront API to set cart attribute before checkout
                        fetch(apiUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-Shopify-Storefront-Access-Token': token
                            },
                            body: JSON.stringify({
                                query: 'mutation cartAttributesUpdate($cartId: ID!, $attributes: [AttributeInput!]!) { cartAttributesUpdate(cartId: $cartId, attributes: $attributes) { cart { id } userErrors { field message } } }',
                                variables: {
                                    cartId: cartId,
                                    attributes: [{ key: 'shopping_url', value: currentUrl }]
                                }
                            })
                        }).then(function(resp) { return resp.json(); }).then(function(data) {
                            console.log('[Demo] Cart attribute set:', data);
                            cart.checkout.open(checkoutUrl);
                        }).catch(function(err) {
                            console.error('[Demo] Failed to set attribute, opening checkout anyway:', err);
                            cart.checkout.open(checkoutUrl);
                        });
                    };
                }
            }
        },

        toggle: { styles: { toggle: { 'background-color': '#111211', ':hover': { 'background-color': '#1d1f1d' }, ':focus': { 'background-color': '#1d1f1d' } } } }
      };
    }

    function ensureSDK() {
      return new Promise(function(resolve, reject){
        if (window.ShopifyBuy && window.ShopifyBuy.UI) return resolve();
        var s = document.createElement('script'); 
        s.async = true; 
        s.src = sdkUrl; 
        s.onload = resolve;
        s.onerror = function() {
          reject(new Error('Failed to load SDK from ' + sdkUrl + '. Make sure dev server is running (yarn dev in buy-button-js)'));
        };
        (document.head || document.body).appendChild(s);
      });
    }
    function buildClient() { 
      return ShopifyBuy.buildClient({ 
        domain: domain, 
        storefrontAccessToken: token,
        snsAppToken: snsAppToken // SNS Application authentication token
      }); 
    }

    async function fetchProductsPage(opts) {
      var queryString = (opts && opts.query) || '';
      var first       = (opts && opts.pageSize) || 12;
      var after       = (opts && opts.after) || null;

      var resp = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Shopify-Storefront-Access-Token': token },
        body: JSON.stringify({
          query: `
            query($q:String, $first:Int!, $after:String) {
              products(first: $first, query: $q, after: $after) {
                edges { cursor node { 
                  id title handle availableForSale
                  images(first:1){nodes{url altText width height}}
                  priceRange { minVariantPrice{amount currencyCode} maxVariantPrice{amount currencyCode} }
                  variants(first: 50) { edges { node { id title availableForSale } } }
                } }
                pageInfo { hasNextPage endCursor }
              }
            }`,
          variables: { q: queryString || null, first: first, after: after }
        })
      });
      var json = await resp.json();
      if (!json.data || !json.data.products) { throw new Error('Storefront error: ' + JSON.stringify(json.errors || json)); }
      return json.data.products;
    }

    /**
     * Fetch purchasability status for a single product.
     * All business logic (inventory thresholds, pre-order rules, scheduled dates)
     * is evaluated server-side.
     *
     * API Usage: GET /api/public/product-purchasable?productIds=123&shop=mystore.myshopify.com
     * Response: { success: true, data: { "123": { isPurchasable: true, isPreOrder: false } } }
     */
    async function fetchPurchasabilityForProduct(productGid) {
      try {
        var match = productGid.match(/\/Product\/(\d+)/);
        var simpleId = match ? match[1] : productGid;

        var params = new URLSearchParams({
          productIds: simpleId,
          shop: domain,
          storefrontToken: token
        });

        var url = snsAppUrl + '/api/public/product-purchasable?' + params.toString();
        console.log('[Purchasable] Fetching status for product', simpleId);

        var response = await fetch(url);

        if (!response.ok) {
          console.warn('[Purchasable] Fetch failed for', simpleId, ':', response.status);
          return null;
        }

        var result = await response.json();

        if (!result.success || !result.data || !result.data[simpleId]) {
          console.warn('[Purchasable] Invalid response for', simpleId, ':', result);
          return null;
        }

        console.log('[Purchasable] Product', simpleId, '→', JSON.stringify(result.data[simpleId]));
        var status = result.data[simpleId];
        // podMessage lives at the top level of the response, not per-product.
        // Surface it on the status object so the caller can show it under the button.
        status.podMessage = result.podMessage || '';
        return status;
      } catch (error) {
        console.error('[Purchasable] Error fetching status for', productGid, ':', error);
        return null;
      }
    }

    function fmtMoney(price) { if (!price) return ''; var a = Number(price.amount || 0).toFixed(2); return '$' + a; }
    function priceText(range) {
      if (!range) return ''; var min = range.minVariantPrice, max = range.maxVariantPrice;
      if (!min || !max) return ''; if (min.amount === max.amount) return fmtMoney(min);
      return fmtMoney(min) + ' - ' + fmtMoney(max);
    }

    function createCard(parent, product) {
      var card = document.createElement('div'); card.className = 'pl-card';
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) card.classList.add('dark');
      var imgUrl = product.images?.nodes?.[0]?.url || ''; var imgAlt = product.images?.nodes?.[0]?.altText || product.title || '';
      var img = document.createElement('img'); img.className = 'pl-img'; img.alt = imgAlt; if (imgUrl) img.src = imgUrl;

      var titleText = product.title || 'Product';
      
      var title = document.createElement('div'); title.className = 'pl-title'; title.textContent = titleText;
      var price = document.createElement('div'); price.className = 'pl-price'; price.textContent = priceText(product.priceRange);
      var mount = document.createElement('div'); mount.className = 'pl-mount';
      card.appendChild(img); card.appendChild(title); card.appendChild(price); card.appendChild(mount); parent.appendChild(card);
      return mount;
    }

    async function renderProductListing(opts) {
      try {
        await ensureSDK(); 
        var client = buildClient();
        
        // Initialize UI with SNS configuration
        var ui = ShopifyBuy.UI.init(client, {}, '', {
          snsAppUrl: snsAppUrl,
          enabled: true
        });
        
        var root = document.getElementById('product-list'); root.innerHTML = '';
        var grid = document.createElement('div'); grid.className = 'pl-grid'; root.appendChild(grid);
        var query = (opts && opts.query) || 'available_for_sale:true';
        var pageSize = (opts && opts.pageSize) || 8; var endCursor = null, hasNext = false;

        async function loadPage(after) {
          var data = await fetchProductsPage({ query: query, pageSize: pageSize, after: after });
          hasNext = !!(data.pageInfo && data.pageInfo.hasNextPage); endCursor = data.pageInfo ? data.pageInfo.endCursor : null;

          for (var i = 0; i < (data.edges || []).length; i++) {
            var p = data.edges[i].node; var mount = createCard(grid, p);

            // Fetch purchasability per product
            var status = await fetchPurchasabilityForProduct(p.id);

            // Show buy button only if server says product is purchasable
            if (status && status.isPurchasable) {
              var isPreOrder = !!(status.isPreOrder);
              ui.createComponent('product', { id: p.id.replace('gid://shopify/Product/',''), node: mount, moneyFormat: '%24%7B%7Bamount%7D%7D', options: buyButtonOptions({ isPreOrder: isPreOrder }) });

              // Print-on-demand titles ship on a delay — show the server-provided
              // notice under the buy button.
              if (status.isPod && status.podMessage) {
                var pod = document.createElement('div');
                pod.className = 'pl-pod-msg';
                pod.innerHTML = status.podMessage.replace(/^(\s*Note:)/i, '<strong>$1</strong>');
                mount.parentNode.appendChild(pod);
              }

              // Pre-order titles ship on a future publication date — show the
              // required pre-order notice with a link to the pre-order terms FAQ.
              if (isPreOrder && status.scheduledPublishDate) {
                var d = new Date(status.scheduledPublishDate + 'T00:00:00');
                var pubDate = isNaN(d) ? status.scheduledPublishDate
                  : d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                var preorder = document.createElement('div');
                preorder.className = 'pl-preorder-msg';
                preorder.innerHTML = 'This title is available for pre-order and will ship on or around ' +
                  pubDate + '. <a href="#faq-pre-order-terms">Terms apply</a>.';
                mount.parentNode.appendChild(preorder);
              }
            }
            // If not purchasable, the card is shown but no buy button is rendered
          }
        }

        await loadPage(null);
        var actions = document.createElement('div'); actions.className = 'pl-actions';
        var more = document.createElement('button'); more.className = 'pl-btn'; more.textContent = 'Load more';
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) more.classList.add('dark');
        more.onclick = async function(){ more.disabled = true; await loadPage(endCursor); more.disabled = false; if (!hasNext) actions.style.display = 'none'; };
        if (hasNext) { actions.appendChild(more); root.appendChild(actions); }
      } catch (error) {
        console.error('Error initializing buy button:', error);
        var root = document.getElementById('product-list');
        root.innerHTML = '<div style="padding:20px;text-align:center;color:red;">' +
          '<h3>⚠️ Development Server Error</h3>' +
          '<p>' + error.message + '</p>' +
          '<p>Please run: <code>yarn dev</code> in the buy-button-js directory</p>' +
          '</div>';
      }
    }

    window.renderProductListing = renderProductListing;
    renderProductListing({ query: '', pageSize: 8 });
  })();
</script>

  </body>
</html>
